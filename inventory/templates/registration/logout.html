{% extends 'registration/base.html' %}

{% block content %}
<div class="login">
<h4>Are you sure you want to Logout?</h4>
<div style="text-align: center; display: flex; justify-content: center;">        
    <div>
        <a href="{% url 'home' %}" class = "btn btn-success" style=" margin: 10px;">Don't Logout</a>
    </div>

    <div>
        <form action="{% url 'logout' %}" method="post" class = "logout" style=" margin: 10px;">
            {% csrf_token %}
            <button type="submit" class = "btn btn-danger">Log Out</button>
        </form>
    </div>
</div>
</div>
{% endblock %}
